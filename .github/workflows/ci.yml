name: build-and-test

on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        run: make clean check

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gobject-introspection \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev pkg-config
      - name: ASan and UBSan
        run: make sanitize

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: true
      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcovr libglib2.0-dev libicu-dev pkg-config
      - name: Coverage gate
        run: make coverage

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: true
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy libglib2.0-dev libicu-dev pkg-config
      - name: Clang-Tidy
        run: make static-analysis

  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          submodules: true
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper devscripts gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep \
            lintian shellcheck zip
      - name: Run complete release gates
        run: make release-check
