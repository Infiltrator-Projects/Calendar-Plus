name: build-and-test

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce main-only automatic immutable publishing
        shell: bash
        run: |
          set -euo pipefail
          release=.github/workflows/release.yml
          grep -Fq '  workflow_run:' "$release"
          grep -Fq 'workflows: ["build-and-test"]' "$release"
          grep -Fq "startsWith(github.event.workflow_run.head_commit.message, 'Release ')" "$release"
          grep -Fq "github.event.workflow_run.head_branch == 'main'" "$release"
          grep -Fq 'published releases are immutable' "$release"
          grep -Fq 'Calendar-Plus-${version}-local-source.zip' "$release"
          if grep -Eq '^  (workflow_dispatch|pull_request|schedule):' "$release"; then
            echo 'Calendar Plus publication must be automatic from tested main only.' >&2
            exit 1
          fi
          if grep -Eq '^  pull_request:|^  merge_group:' .github/workflows/ci.yml; then
            echo 'Calendar Plus CI must use main only.' >&2
            exit 1
          fi

  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        run: make clean check

  sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gobject-introspection \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev pkg-config
      - name: ASan and UBSan
        run: make sanitize

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install coverage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcovr libglib2.0-dev libicu-dev pkg-config
      - name: Coverage gate
        run: make coverage

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy libglib2.0-dev libicu-dev pkg-config
      - name: Clang-Tidy
        run: make static-analysis

  debian-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper devscripts gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep \
            lintian shellcheck unzip zip
      - name: Run complete release gates
        run: make release-check
