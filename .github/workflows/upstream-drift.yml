name: upstream-calendar-drift

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-calendar-drift
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare reviewed Cinnamon calendar surface
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check-upstream-calendar-drift.py
