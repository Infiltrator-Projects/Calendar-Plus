# SPDX-License-Identifier: GPL-3.0-or-later
name: Migrate Calendar Plus to Common 1.8

on:
  workflow_dispatch:
  push:
    branches: [feature/common-1.8-migration]
    paths:
      - .github/workflows/migrate-common-1.8.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/migrate-common-1.8.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out migration branch
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          ref: feature/common-1.8-migration
          fetch-depth: 0
          submodules: recursive

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang-tidy debhelper gettext gcovr \
            gir1.2-glib-2.0-dev gobject-introspection gjs libglib2.0-dev \
            libicu-dev nodejs pkg-config python3 ripgrep shellcheck zip git

      - name: Apply Common 1.8 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected 1 match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "Makefile",
              "INFILTRATR_COMMON_COMMIT := 37c09a0fe497d1662f00a346197c6157b4a035e9\nINFILTRATR_COMMON_VERSION := 1.6.0",
              "INFILTRATR_COMMON_COMMIT := 318b1babc7343403ae5e222ea01235a0fc84d752\nINFILTRATR_COMMON_VERSION := 1.8.0",
              "Common pin")
          replace_once(
              "Makefile",
              "# Calendar Plus consumes only the dependency-free Common core/arithmetic layer.\nINFILTRATR_COMMON_SOURCES := \\\n\t$(INFILTRATR_COMMON_DIR)/src/core.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/arithmetic.c\nINFILTRATR_COMMON_HEADERS := \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/compiler.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/core.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/arithmetic.h",
              "# Calendar Plus consumes Common's dependency-free core/arithmetic/timing\n# plus the thin POSIX/Win32 dynamic-library adapter.\nINFILTRATR_COMMON_SOURCES := \\\n\t$(INFILTRATR_COMMON_DIR)/src/core.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/arithmetic.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/timing.c \\\n\t$(INFILTRATR_COMMON_DIR)/src/dynlib.c\nINFILTRATR_COMMON_HEADERS := \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/compiler.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/core.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/arithmetic.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/timing.h \\\n\t$(INFILTRATR_COMMON_DIR)/include/infiltratr/dynlib.h",
              "Common source footprint")
          replace_once(
              "Makefile",
              "GMODULE_CFLAGS = $(shell $(PKG_CONFIG) --cflags gmodule-2.0)\nGMODULE_LIBS = $(shell $(PKG_CONFIG) --libs gmodule-2.0)\nICU_BRIDGE_LIBS = -ldl -pthread",
              "DYNLIB_LIBS = -ldl\nICU_BRIDGE_LIBS = $(DYNLIB_LIBS) -pthread",
              "dynamic loader link flags")
          replace_once(
              "Makefile",
              "\t\t$(GLIB_CFLAGS) $(GMODULE_CFLAGS) src/about-dialog.c src/project-info.c \\\n\t\t$(INFILTRATR_COMMON_ARCHIVE) -o $@ $(LDFLAGS) $(GMODULE_LIBS) $(MATH_LIBS)",
              "\t\t$(GLIB_CFLAGS) src/about-dialog.c src/project-info.c \\\n\t\t$(INFILTRATR_COMMON_ARCHIVE) -o $@ $(LDFLAGS) $(DYNLIB_LIBS) $(MATH_LIBS)",
              "About helper link")

          replace_once(
              "src/time-formats.c",
              "#include <infiltratr/core.h>\n#include <math.h>",
              "#include <infiltratr/core.h>\n#include <infiltratr/timing.h>\n#include <math.h>",
              "timing include")
          replace_once(
              "src/time-formats.c",
              '''static guint\ndelay_microseconds_to_milliseconds(long double microseconds)\n{\n    long double milliseconds;\n\n    if (!isfinite((double)microseconds) || microseconds <= 0.0L)\n        return 1;\n\n    milliseconds = ceill(microseconds / 1000.0L);\n    if (milliseconds < 1.0L)\n        return 1;\n    if (milliseconds > G_MAXUINT)\n        return G_MAXUINT;\n\n    return (guint)milliseconds;\n}\n''',
              '''static guint\ndelay_seconds_to_milliseconds(long double seconds)\n{\n    uint64_t milliseconds = 0;\n\n    if (!infiltratr_seconds_to_milliseconds_ceil(seconds, &milliseconds))\n        return 1;\n    return milliseconds > G_MAXUINT ? G_MAXUINT : (guint)milliseconds;\n}\n\nstatic guint\ndelay_microseconds_to_milliseconds(long double microseconds)\n{\n    return delay_seconds_to_milliseconds(\n        microseconds / (long double)G_USEC_PER_SEC);\n}\n''',
              "millisecond conversion")
          replace_once(
              "src/time-formats.c",
              '''static guint\ndelay_for_period(gint64 position_microseconds,\n                 long double period_microseconds)\n{\n    long double phase =\n        fmodl((long double)position_microseconds, period_microseconds);\n    long double remaining;\n\n    if (phase < 0.0L)\n        phase += period_microseconds;\n\n    remaining = period_microseconds - phase;\n    if (remaining < 0.5L)\n        remaining = period_microseconds;\n\n    return delay_microseconds_to_milliseconds(remaining);\n}\n''',
              '''static guint\ndelay_for_period(gint64 position_microseconds,\n                 long double period_microseconds)\n{\n    long double remaining = 0.0L;\n\n    if (!infiltratr_period_remaining((long double)position_microseconds,\n                                     period_microseconds,\n                                     &remaining))\n    {\n        return 1;\n    }\n    if (remaining < 0.5L)\n        remaining = period_microseconds;\n\n    return delay_microseconds_to_milliseconds(remaining);\n}\n''',
              "period boundary calculation")
          replace_once(
              "src/time-formats.c",
              '''static guint\ndelay_for_clock_seconds(long double clock_seconds,\n                        long double clock_rate,\n                        gboolean show_seconds)\n{\n    const long double unit = show_seconds ? 1.0L : 60.0L;\n    long double phase = fmodl(clock_seconds, unit);\n\n    if (phase < 0.0L)\n        phase += unit;\n\n    return delay_microseconds_to_milliseconds(\n        (unit - phase) / clock_rate * G_USEC_PER_SEC);\n}\n''',
              '''static guint\ndelay_for_clock_seconds(long double clock_seconds,\n                        long double clock_rate,\n                        gboolean show_seconds)\n{\n    const long double unit = show_seconds ? 1.0L : 60.0L;\n    long double remaining = 0.0L;\n\n    if (!isfinite(clock_rate) || clock_rate <= 0.0L ||\n        !infiltratr_period_remaining(clock_seconds, unit, &remaining))\n    {\n        return 1;\n    }\n\n    return delay_seconds_to_milliseconds(remaining / clock_rate);\n}\n''',
              "clock boundary calculation")

          bridge = Path("src/icu-compat-bridge.c")
          text = bridge.read_text(encoding="utf-8")
          old = '#include <string.h>\n\n#include <unicode/ucal.h>'
          new = '#include <infiltratr/dynlib.h>\n\n#include <unicode/ucal.h>'
          if text.count(old) != 1:
              raise SystemExit('icu bridge: include block not found exactly once')
          text = text.replace(old, new, 1)
          old = '#ifdef _WIN32\n#include <windows.h>\ntypedef HMODULE IcuModule;\nstatic INIT_ONCE bridge_once = INIT_ONCE_STATIC_INIT;\n#else\n#include <dlfcn.h>\n#include <pthread.h>\ntypedef void *IcuModule;\nstatic pthread_once_t bridge_once = PTHREAD_ONCE_INIT;\n#endif'
          new = '#ifdef _WIN32\n#include <windows.h>\nstatic INIT_ONCE bridge_once = INIT_ONCE_STATIC_INIT;\n#else\n#include <pthread.h>\nstatic pthread_once_t bridge_once = PTHREAD_ONCE_INIT;\n#endif'
          if text.count(old) != 1:
              raise SystemExit('icu bridge: platform block not found exactly once')
          text = text.replace(old, new, 1)
          old = '    IcuModule uc;\n    IcuModule i18n;'
          new = '    InfiltratrDynlib uc;\n    InfiltratrDynlib i18n;'
          if text.count(old) != 1:
              raise SystemExit('icu bridge: module fields not found exactly once')
          text = text.replace(old, new, 1)
          start = text.index('#ifdef _WIN32\nstatic IcuModule\nmodule_open')
          end = text.index('static int\nload_symbol', start)
          text = text[:start] + text[end:]
          old = '''static int\nload_symbol(IcuModule module,\n            const char *base_name,\n            const char *major,\n            void *destination,\n            size_t destination_size)\n{\n    char versioned_name[96];\n    void *symbol;\n\n    // NOLINTNEXTLINE(clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling)\n    (void)snprintf(versioned_name,\n                   sizeof versioned_name,\n                   "%s_%s",\n                   base_name,\n                   major);\n    symbol = module_symbol(module, versioned_name);\n    if (symbol == NULL)\n        symbol = module_symbol(module, base_name);\n    if (symbol == NULL)\n        return 0;\n\n    store_function_pointer(destination, destination_size, symbol);\n    return 1;\n}\n'''
          new = '''static int\nload_symbol(const InfiltratrDynlib *module,\n            const char *base_name,\n            const char *major,\n            void *destination,\n            size_t destination_size)\n{\n    char versioned_name[96];\n\n    // NOLINTNEXTLINE(clang-analyzer-security.insecureAPI.DeprecatedOrUnsafeBufferHandling)\n    (void)snprintf(versioned_name,\n                   sizeof versioned_name,\n                   "%s_%s",\n                   base_name,\n                   major);\n    if (infiltratr_dynlib_symbol(module,\n                                 versioned_name,\n                                 destination,\n                                 destination_size))\n    {\n        return 1;\n    }\n    return infiltratr_dynlib_symbol(module,\n                                    base_name,\n                                    destination,\n                                    destination_size) ? 1 : 0;\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('icu bridge: load_symbol block not found exactly once')
          text = text.replace(old, new, 1)
          old = '    module_close(api->i18n);\n    module_close(api->uc);'
          new = '    infiltratr_dynlib_close(&api->i18n);\n    infiltratr_dynlib_close(&api->uc);'
          if text.count(old) != 1:
              raise SystemExit('icu bridge: close block not found exactly once')
          text = text.replace(old, new, 1)
          old = '    api->uc = module_open(uc_name);\n    api->i18n = module_open(i18n_name);\n    if (api->uc == NULL || api->i18n == NULL)'
          new = '    if (!infiltratr_dynlib_open(&api->uc, uc_name) ||\n        !infiltratr_dynlib_open(&api->i18n, i18n_name))'
          if text.count(old) != 1:
              raise SystemExit('icu bridge: open block not found exactly once')
          text = text.replace(old, new, 1)
          if text.count('load_symbol(api->uc') != 1:
              raise SystemExit('icu bridge: UC loader macro not found exactly once')
          text = text.replace('load_symbol(api->uc', 'load_symbol(&api->uc', 1)
          if text.count('load_symbol(api->i18n') != 1:
              raise SystemExit('icu bridge: I18N loader macro not found exactly once')
          text = text.replace('load_symbol(api->i18n', 'load_symbol(&api->i18n', 1)
          bridge.write_text(text, encoding="utf-8")

          about = Path("src/about-dialog.c")
          text = about.read_text(encoding="utf-8")
          old = '#include <gmodule.h>\n'
          new = '#include <infiltratr/dynlib.h>\n'
          if text.count(old) != 1:
              raise SystemExit('about dialog: gmodule include not found exactly once')
          text = text.replace(old, new, 1)
          old = 'static GModule *gtk_module;'
          new = 'static InfiltratrDynlib gtk_module = INFILTRATR_DYNLIB_INIT;'
          if text.count(old) != 1:
              raise SystemExit('about dialog: module storage not found exactly once')
          text = text.replace(old, new, 1)
          old = '''static gboolean\nload_gtk(void)\n{\n    gtk_module = g_module_open("libgtk-3.so.0", G_MODULE_BIND_LAZY |\n                                                G_MODULE_BIND_LOCAL);\n    if (gtk_module == NULL)\n        return FALSE;\n\n#define LOAD_GTK(member, symbol) \\\n    if (!g_module_symbol(gtk_module, symbol, (gpointer *)&gtk_api.member)) \\\n        return FALSE\n\n    LOAD_GTK(init_check, "gtk_init_check");\n    LOAD_GTK(about_dialog_new, "gtk_about_dialog_new");\n    LOAD_GTK(set_program_name, "gtk_about_dialog_set_program_name");\n    LOAD_GTK(set_version, "gtk_about_dialog_set_version");\n    LOAD_GTK(set_comments, "gtk_about_dialog_set_comments");\n    LOAD_GTK(set_website, "gtk_about_dialog_set_website");\n    LOAD_GTK(set_website_label, "gtk_about_dialog_set_website_label");\n    LOAD_GTK(set_copyright, "gtk_about_dialog_set_copyright");\n    LOAD_GTK(set_license, "gtk_about_dialog_set_license");\n    LOAD_GTK(set_wrap_license, "gtk_about_dialog_set_wrap_license");\n    LOAD_GTK(set_logo_icon_name, "gtk_about_dialog_set_logo_icon_name");\n    LOAD_GTK(set_authors, "gtk_about_dialog_set_authors");\n    LOAD_GTK(window_set_title, "gtk_window_set_title");\n    LOAD_GTK(dialog_run, "gtk_dialog_run");\n    LOAD_GTK(widget_show, "gtk_widget_show");\n    LOAD_GTK(widget_destroy, "gtk_widget_destroy");\n\n#undef LOAD_GTK\n    return TRUE;\n}\n'''
          new = '''static gboolean\nload_gtk(void)\n{\n    if (!infiltratr_dynlib_open(&gtk_module, "libgtk-3.so.0"))\n        return FALSE;\n\n#define LOAD_GTK(member, symbol) \\\n    do { \\\n        if (!infiltratr_dynlib_symbol(&gtk_module, symbol, \\\n                                      &gtk_api.member, \\\n                                      sizeof gtk_api.member)) { \\\n            infiltratr_dynlib_close(&gtk_module); \\\n            gtk_api = (Gtk3Api){ 0 }; \\\n            return FALSE; \\\n        } \\\n    } while (0)\n\n    LOAD_GTK(init_check, "gtk_init_check");\n    LOAD_GTK(about_dialog_new, "gtk_about_dialog_new");\n    LOAD_GTK(set_program_name, "gtk_about_dialog_set_program_name");\n    LOAD_GTK(set_version, "gtk_about_dialog_set_version");\n    LOAD_GTK(set_comments, "gtk_about_dialog_set_comments");\n    LOAD_GTK(set_website, "gtk_about_dialog_set_website");\n    LOAD_GTK(set_website_label, "gtk_about_dialog_set_website_label");\n    LOAD_GTK(set_copyright, "gtk_about_dialog_set_copyright");\n    LOAD_GTK(set_license, "gtk_about_dialog_set_license");\n    LOAD_GTK(set_wrap_license, "gtk_about_dialog_set_wrap_license");\n    LOAD_GTK(set_logo_icon_name, "gtk_about_dialog_set_logo_icon_name");\n    LOAD_GTK(set_authors, "gtk_about_dialog_set_authors");\n    LOAD_GTK(window_set_title, "gtk_window_set_title");\n    LOAD_GTK(dialog_run, "gtk_dialog_run");\n    LOAD_GTK(widget_show, "gtk_widget_show");\n    LOAD_GTK(widget_destroy, "gtk_widget_destroy");\n\n#undef LOAD_GTK\n    return TRUE;\n}\n'''
          if text.count(old) != 1:
              raise SystemExit('about dialog: load_gtk block not found exactly once')
          text = text.replace(old, new, 1)
          old = '        fprintf(stderr, "%s: %s\\n", _("Unable to load GTK 3"),\n                g_module_error());'
          new = '        fprintf(stderr, "%s\\n", _("Unable to load GTK 3"));'
          if text.count(old) != 1:
              raise SystemExit('about dialog: error output not found exactly once')
          text = text.replace(old, new, 1)
          old = '    g_module_close(gtk_module);'
          new = '    infiltratr_dynlib_close(&gtk_module);'
          if text.count(old) != 1:
              raise SystemExit('about dialog: close call not found exactly once')
          text = text.replace(old, new, 1)
          about.write_text(text, encoding="utf-8")

          replace_once(
              "README.md",
              "repository. Calendar Plus 3.9.8 compiles only Common's dependency-free\n  `core.c` and `arithmetic.c`: project identity, strict parsing, string helpers,\n  clamping, Euclidean signed division/remainder and saturating signed\n  subtraction. Calendar-specific code does not carry Common's formatting or\n  POSIX providers.",
              "repository. Calendar Plus 3.9.8 compiles Common's dependency-free\n  `core.c`, `arithmetic.c` and `timing.c`, plus the thin cross-platform\n  `dynlib.c` adapter: project identity, strict parsing, string helpers,\n  clamping, negative-safe arithmetic, phase-aligned timer policy and runtime\n  library loading. Calendar-specific code does not carry Common's formatting or\n  POSIX file/path providers.",
              "README architecture Common footprint")
          replace_once(
              "README.md",
              "- Infiltratr Common 1.6 owns the generic parsing/string/numeric primitives used\n  here, including negative-safe Euclidean division/remainder and saturating\n  signed subtraction. Calendar systems, astronomy, event semantics and timer\n  adapters remain Calendar Plus code.",
              "- Infiltratr Common 1.8 owns the generic parsing/string/numeric primitives,\n  phase-aligned timing policy and cross-platform runtime-loader mechanics used\n  here. Calendar systems, astronomy, event semantics, ICU symbol policy and\n  timer/main-loop adapters remain Calendar Plus code.",
              "README maintenance boundary")
          PY

          git -C shared/infiltratr-common fetch origin \
            318b1babc7343403ae5e222ea01235a0fc84d752
          git -C shared/infiltratr-common checkout --detach \
            318b1babc7343403ae5e222ea01235a0fc84d752
          test "$(cat shared/infiltratr-common/VERSION)" = "1.8.0"
          git diff --check

      - name: Run full Calendar Plus verification
        run: |
          set -euo pipefail
          make clean
          make check
          make static-analysis

      - name: Commit verified migration and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-common-1.8.yml
          git config user.name "Shannon Smith"
          git config user.email "infiltratr@yandex.com"
          git add -A
          git diff --cached --check
          git commit -m "Adopt Infiltratr Common 1.8 shared timing and loader"
          git push origin HEAD:feature/common-1.8-migration
