# SPDX-License-Identifier: GPL-3.0-or-later
name: repair-common-path-space

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-common-path-space.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          submodules: recursive

      - name: Install smoke-test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep

      - name: Make Common sub-build path-safe
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Makefile')
          text = path.read_text(encoding='utf-8')

          old_vars = '''INFILTRATR_COMMON_BUILD_DIR := $(abspath $(BUILD_DIR))/infiltratr-common
          INFILTRATR_COMMON_ARCHIVE := $(INFILTRATR_COMMON_BUILD_DIR)/libinfiltratr-common.a'''.replace('          ', '')
          new_vars = '''# The Common sub-make runs from shared/infiltratr-common. Keep its BUILD_DIR
          # textual value relative and whitespace-free so GNU make never has to parse the
          # checkout's absolute path as a target name.
          INFILTRATR_COMMON_BUILD_DIR := ../../$(BUILD_DIR)/infiltratr-common
          INFILTRATR_COMMON_ARCHIVE := $(BUILD_DIR)/infiltratr-common/libinfiltratr-common.a'''.replace('          ', '')
          if text.count(old_vars) != 1:
              raise SystemExit('Common build-directory definition is missing or ambiguous.')
          text = text.replace(old_vars, new_vars)

          old_flags = '''else
          $(error Unsupported BUILD_MODE '$(BUILD_MODE)'; use generic or native)
          endif

          REPRO_SEED_PREFIX'''.replace('          ', '')
          new_flags = '''else
          $(error Unsupported BUILD_MODE '$(BUILD_MODE)'; use generic or native)
          endif

          # Export the fully composed flags to recursive make without re-serialising them
          # through nested shell quotes. This preserves prefix-map arguments when the
          # Calendar Plus checkout path itself contains whitespace.
          export CFLAGS

          REPRO_SEED_PREFIX'''.replace('          ', '')
          if text.count(old_flags) != 1:
              raise SystemExit('CFLAGS export insertion point is missing or ambiguous.')
          text = text.replace(old_flags, new_flags)

          old_call = '''\t\tBUILD_DIR="$(INFILTRATR_COMMON_BUILD_DIR)" \\
          \t\tCFLAGS="$(CFLAGS)" all'''.replace('          ', '')
          new_call = '''\t\tBUILD_DIR="$(INFILTRATR_COMMON_BUILD_DIR)" all'''.replace('          ', '')
          if text.count(old_call) != 1:
              raise SystemExit('Common recursive make invocation is missing or ambiguous.')
          text = text.replace(old_call, new_call)

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          tools/path-space-build.sh

          rm .github/workflows/repair-common-path-space.yml
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n%s\n' '.github/workflows/repair-common-path-space.yml' Makefile | sort)
          if [[ "$changed" != "$expected" ]]; then
            printf 'Unexpected files changed by path-space repair:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit verified repair and remove helper
        run: |
          set -euo pipefail
          git config user.name 'The-First-Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git add Makefile .github/workflows/repair-common-path-space.yml
          git commit -m 'Fix Common build integration in paths with spaces'
          git push origin HEAD:main
