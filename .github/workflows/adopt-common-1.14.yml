name: adopt-common-1.14

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/adopt-common-1.14.yml]

permissions:
  contents: write

jobs:
  adopt:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Install complete release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang debhelper devscripts gettext gobject-introspection gjs \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep lintian shellcheck unzip zip

      - name: Pin Calendar Plus to released Common 1.14.0
        shell: bash
        run: |
          set -euo pipefail
          old_sha='6c1a6c239e51dcf7946b6303a9bad639e8455a17'
          new_sha='744baa063a8cc29e4fd065899bb9c2b12ec97c92'
          files=(
            Makefile
            tests/test-release-model.py
            tools/validate-release-artifacts.sh
            .github/workflows/release.yml
            debian/changelog
          )

          python3 - "$old_sha" "$new_sha" "${files[@]}" <<'PY'
          import pathlib
          import sys

          old_sha, new_sha, *paths = sys.argv[1:]
          old_version = "1.11.0"
          new_version = "1.14.0"
          sha_replacements = 0
          version_replacements = 0
          for name in paths:
              path = pathlib.Path(name)
              text = path.read_text(encoding="utf-8")
              sha_replacements += text.count(old_sha)
              version_replacements += text.count(old_version)
              text = text.replace(old_sha, new_sha).replace(old_version, new_version)
              path.write_text(text, encoding="utf-8")
          if sha_replacements != 2:
              raise SystemExit(f"expected exactly 2 Common commit-pin replacements, found {sha_replacements}")
          if version_replacements < 5:
              raise SystemExit(f"expected at least 5 Common version replacements, found {version_replacements}")
          PY

          git -C shared/infiltratr-common fetch --depth 1 origin "$new_sha"
          git -C shared/infiltratr-common checkout --detach "$new_sha"
          test "$(git -C shared/infiltratr-common rev-parse HEAD)" = "$new_sha"
          test "$(tr -d '[:space:]' < shared/infiltratr-common/VERSION)" = '1.14.0'

          ! git grep -n '1\.11\.0' -- \
            Makefile tests/test-release-model.py tools/validate-release-artifacts.sh \
            .github/workflows/release.yml debian/changelog
          grep -Fq 'INFILTRATR_COMMON_COMMIT := 744baa063a8cc29e4fd065899bb9c2b12ec97c92' Makefile
          grep -Fq 'INFILTRATR_COMMON_VERSION := 1.14.0' Makefile

      - name: Run complete Calendar Plus release gate
        run: |
          set -euo pipefail
          make clean
          make release-check

      - name: Commit exact tested non-workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'The-First-Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git add \
            Makefile \
            tests/test-release-model.py \
            tools/validate-release-artifacts.sh \
            debian/changelog \
            shared/infiltratr-common
          git diff --cached --check
          git diff --cached --quiet && { echo 'No release changes to commit.' >&2; exit 1; }
          git commit -m 'Adopt tested Infiltratr Common 1.14.0 candidate'
          git push origin HEAD:${{ github.head_ref }}
