name: publish-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Install release dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts gettext gh gobject-introspection gjs jq \
            gir1.2-glib-2.0-dev libglib2.0-dev libicu-dev nodejs \
            pkg-config python3 ripgrep lintian shellcheck unzip zip

      - name: Validate, build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags
          head_commit=$(git rev-parse HEAD)
          main_commit=$(git rev-parse origin/main)
          if [[ "$head_commit" != "$main_commit" ]]; then
            printf 'Release checkout %s is not current main %s.\n' \
              "$head_commit" "$main_commit" >&2
            exit 1
          fi

          version=$(sed -n 's/^VERSION := //p' Makefile)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid source version: %s\n' "$version" >&2
            exit 1
          fi
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            printf 'Release tag %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            printf 'Release %s already exists; published releases are immutable.\n' "$tag" >&2
            exit 1
          fi

          make release-check

          deb="dist/calendar-plus_${version}_amd64.deb"
          installer="dist/calendar-plus-${version}-local-folder.run"
          source="dist/Calendar-Plus-${version}-local-source.zip"
          test -f "$deb"
          test -x "$installer"
          test -f "$source"
          unzip -tq "$source"
          test "$(unzip -p "$source" "Calendar-Plus-${version}/shared/infiltratr-common/VERSION" | tr -d '[:space:]')" = "1.9.0"

          notes="${RUNNER_TEMP}/release-notes.md"
          awk '
            NR == 1 { next }
            /^ -- / { exit }
            {
              sub(/^  \* /, "- ")
              print
            }
          ' debian/changelog | sed '/^[[:space:]]*$/d' > "$notes"
          test -s "$notes"

          git tag "$tag" "$head_commit"
          git push origin "$tag"

          gh release create "$tag" "$deb" "$installer" "$source" \
            --verify-tag \
            --target "$head_commit" \
            --title "Calendar Plus $version" \
            --notes-file "$notes" \
            --latest

          expected_assets=$(printf '%s\n%s\n%s\n' \
            "${deb##*/}" "${installer##*/}" "${source##*/}" | sort)
          published_assets=$(gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort)
          if [[ "$published_assets" != "$expected_assets" ]]; then
            printf 'Release %s has an unexpected asset set.\n' "$tag" >&2
            printf 'Expected:\n%s\nPublished:\n%s\n' \
              "$expected_assets" "$published_assets" >&2
            exit 1
          fi

          release_json=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          for asset in "$deb" "$installer" "$source"; do
            name="${asset##*/}"
            local_size=$(stat -c '%s' "$asset")
            remote_size=$(jq -r --arg name "$name" \
              '[.assets[] | select(.name == $name) | .size][0] // 0' \
              <<<"$release_json")
            if [[ "$remote_size" != "$local_size" ]]; then
              printf 'Release asset %s has size %s; expected %s.\n' \
                "$name" "$remote_size" "$local_size" >&2
              exit 1
            fi

            local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
            remote_digest=$(jq -r --arg name "$name" \
              '[.assets[] | select(.name == $name) | .digest][0] // ""' \
              <<<"$release_json")
            if [[ -n "$remote_digest" && "$remote_digest" != "$local_digest" ]]; then
              printf 'Release asset %s digest mismatch.\n' "$name" >&2
              exit 1
            fi
          done

          published_tag=$(gh release view "$tag" --json tagName --jq .tagName)
          test "$published_tag" = "$tag"
