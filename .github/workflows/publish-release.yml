name: Publish Calendar Plus 3.9.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the verified release payload
        uses: actions/checkout@v4

      - name: Verify all three supplied release files
        shell: bash
        run: |
          set -euo pipefail
          cd .release-payload
          sha256sum -c <<'EOF'
          97b7c88fd328edcd28722468efbe4deeb2672faa3f3434d7a783bb120aebdf5c  calendar-plus_3.9.2_amd64.deb
          13329722a91c2879062d01448c3ef6df0fa08a246ed78413cadb1a00d95277b0  calendar-plus-3.9.2-local-folder.run
          64c5e709c5d87e64392fa25f7c998fdda4fb37b89551eb6a35c14023740084f5  Calendar-Plus-3.9.2-local-source.zip
          EOF
          chmod 0755 calendar-plus-3.9.2-local-folder.run
          ./calendar-plus-3.9.2-local-folder.run --verify-only
          test "$(dpkg-deb -f calendar-plus_3.9.2_amd64.deb Package)" = 'calendar-plus'
          test "$(dpkg-deb -f calendar-plus_3.9.2_amd64.deb Version)" = '3.9.2'
          test "$(dpkg-deb -f calendar-plus_3.9.2_amd64.deb Architecture)" = 'amd64'

      - name: Replace the broken bootstrap history with the exact source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_dir=$(mktemp -d)
          release_dir=$(mktemp -d)

          cp .release-payload/calendar-plus_3.9.2_amd64.deb "$release_dir/"
          cp .release-payload/calendar-plus-3.9.2-local-folder.run "$release_dir/"
          cp .release-payload/Calendar-Plus-3.9.2-local-source.zip "$release_dir/"
          chmod 0755 "$release_dir/calendar-plus-3.9.2-local-folder.run"

          {
            unzip -Z1 .release-payload/Calendar-Plus-3.9.2-local-source.zip |
              awk '/\/$/ { next } { sub(/^Calendar-Plus-3\.9\.2\//, ""); print }'
            printf '%s\n' '.github/workflows/publish-release.yml'
          } | LC_ALL=C sort > /tmp/calendar-plus-expected-files
          unzip -q .release-payload/Calendar-Plus-3.9.2-local-source.zip -d "$source_dir"
          cp .github/workflows/publish-release.yml /tmp/publish-release.yml

          git config user.name 'Shannon Smith'
          git config user.email 'infiltratr@yandex.com'
          git checkout --orphan clean-main
          git rm -rf -- .
          cp -a "$source_dir/Calendar-Plus-3.9.2/." .
          install -m 0644 /tmp/publish-release.yml .github/workflows/publish-release.yml
          find . -path ./.git -prune -o -type f -print0 |
            xargs -0 git add --
          git commit -m 'Release Calendar Plus 3.9.2'

          git ls-tree -r --name-only HEAD | LC_ALL=C sort > /tmp/calendar-plus-actual-files
          diff -u /tmp/calendar-plus-expected-files /tmp/calendar-plus-actual-files

          root_sha=$(git rev-parse HEAD)
          git push --force origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$root_sha"

          echo "root_sha=$root_sha" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"

      - name: Wait for the exact final source commit
        id: final
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_SHA: ${{ steps.source.outputs.root_sha }}
        shell: bash
        run: |
          set -euo pipefail
          final_sha=''
          for attempt in $(seq 1 120); do
            head_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head_sha" != "$ROOT_SHA" ]; then
              final_sha=$head_sha
              break
            fi
            sleep 5
          done
          test -n "$final_sha"
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ci.yml?ref=$final_sha" >/dev/null
          if gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish-release.yml?ref=$final_sha" >/dev/null 2>&1; then
            echo 'Temporary publishing workflow remains in the final source tree' >&2
            exit 1
          fi
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Publish the v3.9.2 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.final.outputs.final_sha }}
          RELEASE_DIR: ${{ steps.source.outputs.release_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v3.9.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete v3.9.2 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v3.9.2" >/dev/null 2>&1 || true
          fi

          cat > /tmp/calendar-plus-release-notes.md <<'EOF'
          Calendar Plus 3.9.2 for Cinnamon 6.4, 6.6 and 6.7.

          This release provides the three standard project files:

          - `calendar-plus_3.9.2_amd64.deb` — generic AMD64 Debian package
          - `calendar-plus-3.9.2-local-folder.run` — local hardware-native builder and installer
          - `Calendar-Plus-3.9.2-local-source.zip` — complete source, tests and packaging

          SHA-256:

          - `97b7c88fd328edcd28722468efbe4deeb2672faa3f3434d7a783bb120aebdf5c` — DEB
          - `13329722a91c2879062d01448c3ef6df0fa08a246ed78413cadb1a00d95277b0` — RUN
          - `64c5e709c5d87e64392fa25f7c998fdda4fb37b89551eb6a35c14023740084f5` — source ZIP
          EOF

          gh release create v3.9.2 \
            "$RELEASE_DIR/calendar-plus_3.9.2_amd64.deb" \
            "$RELEASE_DIR/calendar-plus-3.9.2-local-folder.run" \
            "$RELEASE_DIR/Calendar-Plus-3.9.2-local-source.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$FINAL_SHA" \
            --title 'Calendar Plus 3.9.2' \
            --notes-file /tmp/calendar-plus-release-notes.md

      - name: Remove all failed publishing branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            publish-3.9.2-final \
            publish-3.9.2-source \
            publish-3.9.2-upload \
            publish-3.9.2-v2 \
            publish-3.9.2-v3 \
            publish-3.9.2-v4 \
            publish-3.9.2-v5 \
            publish-3.9.2
          do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          done

      - name: Verify the published release downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          verify_dir=$(mktemp -d)
          gh release download v3.9.2 --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          cd "$verify_dir"
          sha256sum -c <<'EOF'
          97b7c88fd328edcd28722468efbe4deeb2672faa3f3434d7a783bb120aebdf5c  calendar-plus_3.9.2_amd64.deb
          13329722a91c2879062d01448c3ef6df0fa08a246ed78413cadb1a00d95277b0  calendar-plus-3.9.2-local-folder.run
          64c5e709c5d87e64392fa25f7c998fdda4fb37b89551eb6a35c14023740084f5  Calendar-Plus-3.9.2-local-source.zip
          EOF
