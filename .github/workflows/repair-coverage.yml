# SPDX-License-Identifier: GPL-3.0-or-later
name: repair-calendar-coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-coverage.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Isolate Calendar coverage from Common build data
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Makefile')
          text = path.read_text(encoding='utf-8')
          old = "\tgcovr --root . --filter src --exclude 'src/about-dialog.c' \\\n\t\t--print-summary --fail-under-line $(COVERAGE_MIN_LINES) \\\n\t\t--html-details -o \"$(BUILD_DIR)/coverage.html\""
          new = "\tgcovr --root . --filter src --exclude 'src/about-dialog.c' \\\n\t\t--gcov-exclude-directories '.*/build/infiltratr-common$$' \\\n\t\t--print-summary --fail-under-line $(COVERAGE_MIN_LINES) \\\n\t\t--html-details -o \"$(BUILD_DIR)/coverage.html\""
          if old not in text:
              raise SystemExit('Expected coverage recipe not found; refusing an ambiguous edit.')
          if text.count(old) != 1:
              raise SystemExit('Coverage recipe is not unique; refusing an ambiguous edit.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/repair-coverage.yml
          git diff --check
          git diff -- Makefile .github/workflows/repair-coverage.yml

      - name: Commit verified repair and remove helper
        run: |
          set -euo pipefail
          git config user.name 'The-First-Infiltrator'
          git config user.email 'infiltratr@yandex.com'
          git add Makefile .github/workflows/repair-coverage.yml
          git commit -m 'Fix Calendar coverage isolation from Common'
          git push origin HEAD:main
